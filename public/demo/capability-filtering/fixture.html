<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capability filtering e2e fixture</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; color: #222; }
    table { border-collapse: collapse; margin-bottom: 24px; }
    th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: right; font-variant-numeric: tabular-nums; }
    thead th { background: #f4f4f4; }
  </style>
</head>
<body>
  <h1>Capability filtering e2e fixture</h1>
  <p>Both a numeric-only table and a mixed table so the menu / lozenge filter
     has something concrete to filter for both column types.</p>

  <script>
    // Declared BEFORE the bundle so it's read at init time.
    window.gridSight = { pageConfig: { enrichments: ['heatmap', 'sliders', 'statistics'] } };
  </script>

  <table id="numeric-table">
    <tr><th></th>     <th>10</th><th>20</th><th>30</th></tr>
    <tr><th>1000</th> <td>4.2</td><td>5.1</td><td>5.9</td></tr>
    <tr><th>2000</th> <td>3.6</td><td>4.4</td><td>5.0</td></tr>
    <tr><th>3000</th> <td>3.0</td><td>3.7</td><td>4.2</td></tr>
  </table>

  <table id="mixed-table">
    <tr><th></th>      <th>colour</th><th>score</th></tr>
    <tr><th>row-a</th> <td>red</td>   <td>4.2</td></tr>
    <tr><th>row-b</th> <td>blue</td>  <td>5.1</td></tr>
    <tr><th>row-c</th> <td>red</td>   <td>3.7</td></tr>
  </table>

  <script src="../../grid-sight.iife.js"></script>
</body>
</html>
