<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Grid-Sight · Annotations · Single table</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; color: #222; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
    th { background: #f4f4f4; }
  </style>
</head>
<body>
  <h1>Annotations — single table</h1>
  <table id="tbl-sales" data-gs-key="sales">
    <caption>Quarterly sales</caption>
    <thead>
      <tr><th>Region</th><th>Q3</th></tr>
    </thead>
    <tbody>
      <tr data-gs-row-key="acme"><th scope="row">Acme</th><td>1200</td></tr>
      <tr data-gs-row-key="globex"><th scope="row">Globex</th><td>980</td></tr>
      <tr data-gs-row-key="initech"><th scope="row">Initech</th><td>540</td></tr>
    </tbody>
  </table>

  <script src="../../grid-sight.iife.js"></script>
</body>
</html>
